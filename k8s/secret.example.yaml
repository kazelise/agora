# Copy to a local secret.yaml (not committed) and fill in.
#   kubectl --namespace agora apply -f secret.yaml
# Then set AGORA_K8S_SECRET_NAME=agora-cloud so Jobs use secretKeyRef.
apiVersion: v1
kind: Secret
metadata:
  name: agora-cloud
  namespace: agora
type: Opaque
stringData:
  cluster-token: replace-me
  openai-api-key: replace-me
  openai-base-url: http://host.docker.internal:8317/v1
